name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catches upstream changes (QGIS repo layout, signing-key expiry 2027-08-08)

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning install.sh usb-eject/usb-eject.sh wifi-hotspot/hotspot.sh tests/run-qgis-containers.sh
      - name: syntax of generated/embedded shell is covered by unit tests; compile all python
        run: python3 -m compileall -q common usb-eject wifi-hotspot printer-setup qgis-installer tests
      - name: unit tests (offline)
        run: python3 tests/test_units.py
      - name: qgis-installer core and command line (offline)
        run: python3 tests/test_qgis_installer.py
      - name: guide drift check, offline (parser and comparison against a saved excerpt)
        run: python3 -W error::ResourceWarning tests/test_guide_drift.py
      - name: qgis-installer window (Tk under a virtual display)
        run: |
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python3 tests/test_qgis_gui.py
      - name: qgis-installer distribution paths (Fedora/Atomic, openSUSE, Arch/AUR, containers, Nix)
        run: python3 tests/test_qgis_distros.py
      - name: install.sh into a temp prefix and back
        run: |
          p=$(mktemp -d)
          ./install.sh --prefix "$p" all
          test -x "$p/bin/qgis-installer" && test -x "$p/bin/qgis-installer-cli" && test -f "$p/lib/linux-scripts/lscommon.py"
          test -f "$p/lib/linux-scripts/qgis_installer/cli.py"
          "$p/bin/qgis-installer-cli" --lang en --json info | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema"] == 1'
          ./install.sh --prefix "$p" --uninstall all
          test ! -e "$p/lib/linux-scripts"

  distros:
    # unit tests + install.sh + "suggested package names really exist" on Debian/Ubuntu/Fedora/Arch/openSUSE/Alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run-distros.sh

  qr-decode:
    # the QR generator is checked with a real decoder (zbar) in a container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run-qr-decode.sh

  qgis-containers:
    # real apt + qgis.org inside throwaway containers: key fingerprint check, repo config, uninstall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run-qgis-containers.sh

  qgis-recipes:
    # every other install recipe of the installation guide, resolved (dry run) on its own distribution:
    # Fedora dnf, openSUSE zypper, Arch pacman, Debian apt, Mageia urpmi, Flathub branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run-recipes-containers.sh

  guide-drift:
    # weekly: has the QGIS installation guide moved on (new release, LTR, Ubuntu/Debian codename, signing key)?
    # A red run means qgis_installer/system.py needs updating; it never changes anything by itself.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/guide_drift.py
