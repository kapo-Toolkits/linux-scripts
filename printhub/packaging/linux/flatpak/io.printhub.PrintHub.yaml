# Flatpak manifest for PrintHub.
#   flatpak-builder --user --install build-dir \
#       packaging/linux/flatpak/io.printhub.PrintHub.yaml
#
# Uses the KDE runtime (ships Qt 6) + a PySide6 wheel. Printing reaches the
# host CUPS through the standard portal; --filesystem=home lets users open
# their files. LibreOffice, if present on the host, is reached via the portal.
app-id: io.printhub.PrintHub
runtime: org.kde.Platform
runtime-version: "6.7"
sdk: org.kde.Sdk
command: printhub

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  # printing goes through the portal; no raw device access needed

modules:
  - name: pyside6
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-index --find-links=. PySide6 shiboken6
    sources:
      # Vendor the wheels next to this manifest (offline builds) or switch to
      # `--extra-data` fetch. Kept as a placeholder pattern here.
      - type: dir
        path: wheels

  - name: printhub
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps .
      - install -Dm644 packaging/linux/printhub.desktop
        /app/share/applications/io.printhub.PrintHub.desktop
      - install -Dm644 packaging/assets/printhub.png
        /app/share/icons/hicolor/256x256/apps/io.printhub.PrintHub.png
      - install -Dm644 packaging/linux/io.printhub.PrintHub.metainfo.xml
        /app/share/metainfo/io.printhub.PrintHub.metainfo.xml
    sources:
      - type: dir
        path: ../../..
