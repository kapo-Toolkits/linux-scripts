[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printhub"
version = "0.2.1"
description = "A universal, cross-platform print front-end (PDF, images, Office)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PrintHub contributors" }]
keywords = ["printing", "cups", "pdf", "qt", "cross-platform"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/kapo-Toolkits/linux-scripts/tree/main/printhub"
Issues = "https://github.com/kapo-Toolkits/linux-scripts/tree/main/printhub/issues"

# GUI entry point: on Windows this builds a no-console launcher.
[project.gui-scripts]
printhub = "printhub.__main__:main"

[tool.setuptools]
packages = ["printhub"]

[tool.setuptools.package-data]
printhub = ["../packaging/assets/*"]
